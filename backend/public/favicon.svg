<?xml version="1.0" encoding="UTF-8"?>
<!--
  HHMS Favicon (SVG — modern browsers use this natively)
  Also export as favicon.ico (16x16, 32x32, 48x48) using a tool like:
    - https://realfavicongenerator.net  (upload logo-icon.svg)
    - Inkscape: File > Export PNG, then convert with ImageMagick
      convert favicon-32.png favicon-16.png favicon.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A6B"/>
      <stop offset="100%" style="stop-color:#0D2347"/>
    </linearGradient>
    <linearGradient id="c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4A8"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Medical cross vertical -->
  <rect x="13.5" y="7" width="5" height="18" rx="1.5" fill="url(#c)"/>
  <!-- Medical cross horizontal -->
  <rect x="7" y="13.5" width="18" height="5" rx="1.5" fill="url(#c)"/>
</svg>
