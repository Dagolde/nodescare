<?xml version="1.0" encoding="UTF-8"?>
<!--
  HHMS Icon Mark (standalone)
  Dimensions: 100 x 100
  Use for: app icon base, favicon base, profile pictures
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A6B"/>
      <stop offset="100%" style="stop-color:#0D2347"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4A8"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square (for app icon) -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="94" height="94" rx="20"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Shield shape -->
  <path d="M50 12 L78 23 L78 52 Q78 74 50 88 Q22 74 22 52 L22 23 Z"
        fill="rgba(255,255,255,0.07)"/>

  <!-- Medical cross (vertical) -->
  <rect x="43.5" y="28" width="13" height="44" rx="3.5" fill="url(#cross)"/>
  <!-- Medical cross (horizontal) -->
  <rect x="28" y="43.5" width="44" height="13" rx="3.5" fill="url(#cross)"/>

  <!-- Pulse / heartbeat line -->
  <polyline points="18,72 26,72 31,63 36,81 41,58 46,74 50,72 82,72"
            fill="none" stroke="rgba(0,212,168,0.4)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top shine -->
  <ellipse cx="50" cy="18" rx="20" ry="6"
           fill="rgba(255,255,255,0.06)"/>
</svg>
