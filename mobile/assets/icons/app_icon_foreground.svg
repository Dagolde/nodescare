<?xml version="1.0" encoding="UTF-8"?>
<!--
  HHMS Android Adaptive Icon — Foreground layer
  Export as 1024x1024 PNG → mobile/assets/icons/app_icon_foreground.png
  The safe zone is the center 66% (roughly 680x680 of 1024x1024)
  Keep the cross within that safe zone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5B8"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Transparent background (adaptive icon uses separate background layer) -->

  <!-- Shield (subtle white) -->
  <path d="M512 200 L760 300 L760 520 Q760 700 512 820 Q264 700 264 520 L264 300 Z"
        fill="rgba(255,255,255,0.10)"/>

  <!-- Medical cross — vertical -->
  <rect x="462" y="310" width="100" height="360" rx="28" fill="url(#cross)" filter="url(#glow)"/>
  <!-- Medical cross — horizontal -->
  <rect x="310" y="462" width="404" height="100" rx="28" fill="url(#cross)" filter="url(#glow)"/>

  <!-- Pulse line -->
  <polyline
    points="264,680 330,680 370,610 420,750 460,560 500,680 512,665 760,665"
    fill="none"
    stroke="rgba(0,229,184,0.40)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
