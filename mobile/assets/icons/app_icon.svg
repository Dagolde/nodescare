<?xml version="1.0" encoding="UTF-8"?>
<!--
  HHMS Flutter App Icon
  Export as 1024x1024 PNG → mobile/assets/icons/app_icon.png
  Then run: flutter pub run flutter_launcher_icons

  To export from this SVG:
    Inkscape CLI: inkscape app_icon.svg --export-png=app_icon.png --export-width=1024 --export-height=1024
    Or open in browser, screenshot, or use https://svgtopng.com
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E4080"/>
      <stop offset="100%" style="stop-color:#0D2347"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5B8"/>
      <stop offset="100%" style="stop-color:#00B894"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="crossGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Subtle radial highlight top-left -->
  <radialGradient id="hl" cx="30%" cy="25%" r="50%">
    <stop offset="0%" style="stop-color:rgba(255,255,255,0.10)"/>
    <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
  </radialGradient>
  <rect width="1024" height="1024" rx="220" fill="url(#hl)"/>

  <!-- Shield shape -->
  <path d="M512 120 L820 240 L820 530 Q820 760 512 900 Q204 760 204 530 L204 240 Z"
        fill="url(#shield)"/>
  <path d="M512 120 L820 240 L820 530 Q820 760 512 900 Q204 760 204 530 L204 240 Z"
        fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="4"/>

  <!-- Medical cross — vertical bar -->
  <rect x="446" y="280" width="132" height="464" rx="36" fill="url(#cross)" filter="url(#crossGlow)"/>
  <!-- Medical cross — horizontal bar -->
  <rect x="280" y="446" width="464" height="132" rx="36" fill="url(#cross)" filter="url(#crossGlow)"/>

  <!-- Heartbeat / pulse line -->
  <polyline
    points="180,740 280,740 330,640 390,840 440,580 490,740 512,720 820,720"
    fill="none"
    stroke="rgba(0,229,184,0.35)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Bottom wordmark inside icon -->
  <text x="512" y="970" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="800" letter-spacing="8"
        text-anchor="middle" fill="rgba(255,255,255,0.0)">HHMS</text>
</svg>
